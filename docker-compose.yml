services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: platform_admin
      POSTGRES_PASSWORD: platform_admin
      POSTGRES_DB: platform
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_admin -d platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/deployment/api.Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["3001:3001"]

  web:
    build:
      context: .
      dockerfile: infrastructure/deployment/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  postgres_data:
